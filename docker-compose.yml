  backend:
    build:
      context: ./backend
    container_name: portinity-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-portinity-super-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      - OPENROUTER_LLM_MODEL=${OPENROUTER_LLM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: portinity-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

